[package]
name = "mcp-student-records"
version = "1.1.0"
edition = "2024"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Student Records MCP Server — a Student Information System (students, courses, enrollments, grades & rubrics, attendance, support, guardians & FERPA-gated communications, transcripts, and learning analytics) with FERPA access logging"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-student-records"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "sis", "education", "ferpa", "gradebook"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
adk-mcp-sdk = "0.1"
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[workspace]
